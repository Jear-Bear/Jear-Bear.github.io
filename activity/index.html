<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="activity">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Japanese word games</title>
  <!--
    The Discord Activity's first page (the URL Mapping "/" → www.jareddesu.com/activity): pick
    a game. Each game is its own page beside this one (wordle/, crossword/), opened with
    Discord's query kept (scripts/activity/pick.js). docs/discord-activity.md
  -->
  <link rel="stylesheet" href="/.proxy/site/styles/base.css?v=4">
  <link rel="stylesheet" href="/.proxy/site/styles/activity.css?v=2">
</head>
<body>
  <main id="main">
    <div class="container act act-pick">
      <h1 class="act-pick-title">Pick a game <span lang="ja">ゲームを選ぶ</span></h1>
      <a class="act-pick-card" href="/wordle/" data-game>
        <span class="act-pick-ja" lang="ja">言葉</span>
        <strong>Kana Wordle</strong>
        <span>Guess today’s 4- or 5-kana word in 8 tries.</span>
      </a>
      <a class="act-pick-card" href="/crossword/" data-game>
        <span class="act-pick-ja" lang="ja">十字</span>
        <strong>Daily Kana Crossword</strong>
        <span>Today’s mini and daily puzzles, in kana or kanji.</span>
      </a>
      <p class="act-muted">Everyone in the voice channel can see who finished today’s puzzles.</p>
    </div>
  </main>
  <script type="module" src="/.proxy/site/scripts/activity/pick.js?v=1"></script>
</body>
</html>
