# Sponsor CRM Worker. Deployed by .github/workflows/sponsor-crm-deploy.yml,
# which fills in the real D1 database_id at deploy time and pushes the
# secrets. Setup: docs/sponsor-crm-setup.md
name = "sponsor-crm"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://www.jareddesu.com,https://jareddesu.com,https://staging.jareddesu.com"
ALLOW_LOCALHOST = "true"
YT_CHANNEL_ID = "UCSIxTP9PCM2kcTszONRxZ1w"   # public channel ID
PUBLIC_ORIGIN = "https://sponsor-crm.jared-65b.workers.dev"
DISCORD_POST_HOUR = "9"      # the leaderboard's daily Discord post, America/Chicago time (board.js)
DISCORD_POST_MINUTE = "5"

[[d1_databases]]
binding = "DB"
database_name = "sponsor-crm"
database_id = "00000000-0000-0000-0000-000000000000"   # replaced at deploy time
migrations_dir = "migrations"

[observability]
enabled = false

# OAuth tokens for the Claude connector (hashed; props encrypted)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"   # replaced at deploy time

# Daily at 13:40 UTC (after the stats Action): refresh uploads and channel history.
# 14:05 and 15:05 UTC: the leaderboard's Discord post. One of the two is 9:05 in Chicago
# whatever the season; the post goes out on that one (and the later one retries).
[triggers]
crons = ["40 13 * * *", "5 14 * * *", "5 15 * * *"]
