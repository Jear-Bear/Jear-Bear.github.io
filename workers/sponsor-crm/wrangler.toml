# Sponsor CRM Worker. Deployed by .github/workflows/sponsor-crm-deploy.yml,
# which fills in the real D1 database_id at deploy time and pushes the
# secrets. Setup: docs/sponsor-crm-setup.md
name = "sponsor-crm"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://www.jareddesu.com,https://jareddesu.com"
ALLOW_LOCALHOST = "true"
YT_CHANNEL_ID = "UCSIxTP9PCM2kcTszONRxZ1w"   # public channel ID
PUBLIC_ORIGIN = "https://sponsor-crm.jared-65b.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "sponsor-crm"
database_id = "00000000-0000-0000-0000-000000000000"   # replaced at deploy time
migrations_dir = "migrations"

[observability]
enabled = false

# OAuth tokens for the Claude connector (hashed; props encrypted)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"   # replaced at deploy time

# Daily at 13:40 UTC (after the stats Action): refresh uploads and channel history
[triggers]
crons = ["40 13 * * *"]
