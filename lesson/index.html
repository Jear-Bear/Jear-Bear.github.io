  <meta name="color-scheme" content="light dark">
  <!-- jareddesu.com/lesson: the short link to say in videos. Counts the visit
       (under the "ohanasi" tracked link, place "lesson" or ?via=…) and goes
       straight to Ohanasi. See scripts/partner.js for the sponsor details. -->
  <meta property="og:title" content="Your first 1-on-1 Japanese lesson is free">
  <meta property="og:description" content="A free online lesson with a Japanese teacher from Ohanasi, any level, even starting from zero. (Ohanasi sponsors my channel.)">
  <meta property="og:site_name" content="Jared P.">
  <link rel="icon" href="/images/logo.png">
  <script>
    (function () {
      var TARGET = 'https://ohanasi.co/jared';
      var q = new URLSearchParams(location.search);
      var via = (q.get('via') || 'lesson').toLowerCase();
      if (!/^[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?$/.test(via)) via = 'lesson';
      var body = JSON.stringify({ slug: 'ohanasi', via: via });
      var url = 'https://sponsor-crm.jared-65b.workers.dev/public/click';
      var sent = false;
      if (!/bot|crawl|spider|preview|facebookexternalhit|discord|slack|whatsapp|telegram/i.test(navigator.userAgent)) {
        try { sent = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' })); } catch (e) { /* ignore */ }
        if (!sent) try { fetch(url, { method: 'POST', body: body, keepalive: true, credentials: 'omit', headers: { 'Content-Type': 'text/plain' } }).catch(function () {}); } catch (e) { /* ignore */ }
      }
      location.replace(TARGET);
    })();
  </script>

    a { color: inherit; }
