# Refreshes data/sponsorships/stats.public.json from the YouTube Data and
# Analytics APIs. Commits only when the data changed. If any API call fails
# the script exits before writing, so the last good file stays live.
# Setup: docs/sponsor-stats-setup.md
name: Sponsor stats

on:
  schedule:
    - cron: '23 9 * * *'   # daily, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ubuntu-latest ships Node 20+, so no setup step or npm install is needed
      - name: Fetch stats
        run: node scripts/sponsor-stats.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/sponsorships/stats.public.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sponsorships/stats.public.json
          git commit -m "Update sponsor stats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
