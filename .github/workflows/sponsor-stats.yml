# Refreshes data/sponsorships/stats.public.json (public page) and
# stats.private.enc.json (encrypted sponsor dashboard) from the YouTube Data
# and Analytics APIs. Commits only when the data changed. If any API call
# fails the script exits before writing, so the last good files stay live.
# Setup: docs/sponsor-stats-setup.md
name: Sponsor stats

on:
  schedule:
    - cron: '23 9 * * *'   # daily, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ubuntu-latest ships Node 20+, so no setup step or npm install is needed
      - name: Fetch stats
        run: node scripts/sponsor-stats.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # Private daily history for the sponsor CRM: written to the runner's
          # temp dir (never the repo) only when the ingest key is set
          CRM_INGEST_FILE: ${{ secrets.CRM_INGEST_KEY != '' && format('{0}/crm-ingest.json', runner.temp) || '' }}

      - name: Commit if changed
        run: |
          git add data/sponsorships/stats.public.json
          git add data/sponsorships/stats.private.enc.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sponsor stats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Sends the daily views and subscriber changes to the sponsor CRM Worker
      # (docs/sponsor-crm-setup.md). Skipped until CRM_INGEST_KEY is set.
      # The data is never printed or committed.
      - name: Send history to the sponsor CRM
        env:
          CRM_INGEST_KEY: ${{ secrets.CRM_INGEST_KEY }}
          CRM_INGEST_URL: https://sponsor-crm.jared-65b.workers.dev/api/ingest/stats
        run: |
          FILE="${RUNNER_TEMP}/crm-ingest.json"
          if [ -z "$CRM_INGEST_KEY" ] || [ ! -f "$FILE" ]; then
            echo "CRM_INGEST_KEY not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$CRM_INGEST_URL" \
            -H "Authorization: Bearer ${CRM_INGEST_KEY}" -H 'Content-Type: application/json' --data-binary "@${FILE}")
          rm -f "$FILE"
          if [ "$status" != "200" ]; then
            echo "::warning::The sponsor CRM didn't accept the history (HTTP $status)."
            exit 1
          fi
          echo "Sent the history to the sponsor CRM."
